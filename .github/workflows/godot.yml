name: godot-client
on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue tests main plus the queued PRs as one commit before it lands; a required check
  # that doesn't run on this event never reports there, and the queue waits until it times out.
  merge_group:
env:
  # The same pinned build as the cloud environment's setup script. Each SHA-512 is that file's line in the
  # release's own SHA512-SUMS.txt (github.com/godotengine/godot/releases/tag/4.3-stable).
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
  GODOT_SHA512: fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a
  GODOT_VERSION: 4.3.stable.official.77dcf97d8
  TEMPLATES_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
  TEMPLATES_SHA512: 476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Godot
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"  # release host 504s now and then
          echo "$GODOT_SHA512  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          test "$(godot --headless --version)" = "$GODOT_VERSION"
          godot --headless --quit
      - name: Positions from a recorded log equal the engine's at every tick boundary
        run: |
          python client/godot/tests/make_fixture.py "$RUNNER_TEMP/fx" --agents 100 --days 3 --seed 4
          godot --headless --path client/godot --script res://tests/test_positions.gd -- "$RUNNER_TEMP/fx"
      - name: A playback pack equals the engine's replay at every 10th tick, on positions, holdings and who is where (G7)
        run: |
          python -m asiimov.run --out "$RUNNER_TEMP/world" --agents 100 --days 3 --seed 17 --fire 3@1
          python client/godot/tools/make_playback.py "$RUNNER_TEMP/world" "$RUNNER_TEMP/pack.json.gz" --expected "$RUNNER_TEMP/expected.json"
          godot --headless --path client/godot --script res://tests/test_playback.gd -- "$RUNNER_TEMP/pack.json.gz" "$RUNNER_TEMP/expected.json"
      - name: Live client against the live runner, every tick checked against the engine's view
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/live" --agents 25 --paused --port 8765 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8765) 2>/dev/null && break; sleep 0.2; done
          godot --headless --path client/godot --script res://tests/test_live.gd -- ws://127.0.0.1:8765/ 300
          godot --headless --path client/godot --script res://tests/test_reload.gd -- ws://127.0.0.1:8765/
      - name: Inhabitant client acts from the server's menu and gets every receipt (bar 6)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/inhabit" --agents 25 --paused --port 8766 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8766) 2>/dev/null && break; sleep 0.2; done
          godot --headless --path client/godot --script res://tests/test_inhabit.gd -- ws://127.0.0.1:8766/ 3 200
      - name: The player's own plan settles step by step against the engine (readable-world C2)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/plan" --agents 25 --paused --port 8767 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8767) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8767/ "" step --until 60
          godot --headless --path client/godot --script res://tests/test_plan.gd -- ws://127.0.0.1:8767/ 3
      - name: The player says a line to a villager and gets its answer in words (say-1)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/say" --agents 25 --paused --port 8768 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8768) 2>/dev/null && break; sleep 0.2; done
          godot --headless --path client/godot --script res://tests/test_say.gd -- ws://127.0.0.1:8768/ 3
      - name: The player asks for food with the chip; a yes hands it over with a deal (talk-1)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/talk1" --agents 25 --paused --port 8771 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8771) 2>/dev/null && break; sleep 0.2; done
          godot --headless --path client/godot --script res://tests/test_talk1.gd -- ws://127.0.0.1:8771/ 3
      - name: The Talk box keeps a pick and a line, and says why nothing was given (aipt3)
        run: godot --headless --path client/godot --script res://tests/test_talkbox.gd
      - name: The player walks with the keys; the engine holds the tile and the E list is the server's offer (walk-1)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/walk" --agents 25 --paused --port 8772 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8772) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8772/ "" step --until 60
          godot --headless --path client/godot --script res://tests/test_walk.gd -- ws://127.0.0.1:8772/ 3
      - name: Things lie on their tiles; the E list takes, puts down and uses them as the server offers (things-1)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/things" --agents 25 --things --paused --port 8773 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8773) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8773/ "" step --until 60
          godot --headless --path client/godot --script res://tests/test_things.gd -- ws://127.0.0.1:8773/ 3
      - name: The Trade panel's sides and words; a gift moves, an offer is answered in words, a yes makes its deal (deal-1)
        run: |
          python -m asiimov.live --out "$RUNNER_TEMP/offer" --agents 25 --things --paused --port 8774 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8774) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8774/ "" step --until 60
          godot --headless --path client/godot --script res://tests/test_offer.gd -- ws://127.0.0.1:8774/ 3
      - name: The inhabitant frame draws the map art and the state, plan and talk panels (V-pass)
        run: |
          pip install pillow
          python -m asiimov.live --out "$RUNNER_TEMP/frame" --agents 100 --seed 17 --paused --port 8769 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8769) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8769/ "" step --until 60
          xvfb-run -a -s "-screen 0 1600x900x24" godot --path client/godot -- --url ws://127.0.0.1:8769/ --inhabit 29 --screenshot "$RUNNER_TEMP/frame.png"
          python client/godot/tests/check_frame.py "$RUNNER_TEMP/frame.png"
      - name: The AI playtest harness sees the client and types into it (plan/ai-playtest.md)
        run: |
          pip install python-xlib pillow
          python -m asiimov.live --out "$RUNNER_TEMP/aiplay" --agents 25 --paused --port 8770 &
          for i in $(seq 50); do (echo > /dev/tcp/127.0.0.1/8770) 2>/dev/null && break; sleep 0.2; done
          python scripts/s16b.py op ws://127.0.0.1:8770/ "" step --until 60
          python tests/aiplay_smoke.py ws://127.0.0.1:8770/ "$RUNNER_TEMP/aiplay" "$RUNNER_TEMP/aiplay-work"

  # G7: the client as a stranger gets it. Built from this checkout alone, with a recorded world inside, and
  # run with no engine behind it: the Linux build under xvfb, the web build in headless Chrome.
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Godot
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA512  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          test "$(godot --headless --version)" = "$GODOT_VERSION"
      - uses: actions/cache@v4
        id: templates
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-templates-4.3-stable-476366ca-web-linux-windows-macos
      - name: Install the pinned export templates (1 GB; cached after the first run)
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/templates.tpz" "$TEMPLATES_URL"
          echo "$TEMPLATES_SHA512  $RUNNER_TEMP/templates.tpz" | sha512sum -c -
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/web_nothreads_release.zip \
            templates/linux_release.x86_64 templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe templates/macos.zip \
            -d ~/.local/share/godot/export_templates/4.3.stable
      - name: Bundle a recorded world (a stub world today; the v0 log when it exists)
        run: |
          python -m asiimov.run --out "$RUNNER_TEMP/world" --agents 100 --days 3 --seed 17 --fire 3@1
          python client/godot/tools/make_playback.py "$RUNNER_TEMP/world" client/godot/bundled/playback.json.gz
      - name: Export web, Linux, Windows and macOS
        run: |
          mkdir -p build/web build/linux build/windows build/macos
          for p in Web Linux Windows macOS; do godot --headless --path client/godot --export-release "$p"; done
          test -s build/web/index.wasm -a -s build/web/index.pck -a -s build/linux/asiimov.x86_64 \
            -a -s build/windows/asiimov.exe -a -s build/macos/asiimov.zip
      - name: The Linux build plays its bundled world
        run: |
          cd "$RUNNER_TEMP"  # away from the checkout: the build has only what is inside it
          xvfb-run -a -s "-screen 0 1600x900x24" "$GITHUB_WORKSPACE/build/linux/asiimov.x86_64" -- --at 200 --pick plaza --screenshot "$RUNNER_TEMP/linux.png" | tee linux.log
          grep -q "^playback: ready, engine " linux.log
          test -s "$RUNNER_TEMP/linux.png"
      - name: The web build plays its bundled world in a browser, with no engine and nothing fetched from elsewhere
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          WEB_SMOKE_CHANNEL=chrome node client/godot/tests/web_smoke.js build/web "$RUNNER_TEMP/web.png"
      - name: Pack the builds
        run: |
          cp "$RUNNER_TEMP/linux.png" "$RUNNER_TEMP/web.png" build/
          (cd build/web && zip -q -r ../asiimov-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: asiimov-client-${{ github.sha }}
          path: |
            build/asiimov-web.zip
            build/linux/asiimov.x86_64
            build/windows/asiimov.exe
            build/macos/asiimov.zip
            build/linux.png
            build/web.png
